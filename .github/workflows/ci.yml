name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The zero-dependency path. This is the job that proves the product works with
  # no PostgreSQL, no Redis and no API key — the configuration most reviewers
  # will actually run (ADR-004, ADR-009).
  # ───────────────────────────────────────────────────────────────────────────
  api-sqlite:
    name: API · SQLite · no external services
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "true"
      ENVIRONMENT: test
      LLM_PROVIDER: heuristic
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/ai[dev]"
          pip install -e "apps/api[dev]"

      - name: Lint (ruff)
        # The whole repository, not just the two packages: `scripts/` and `evals/`
        # are guarded by pre-commit, and a scope narrower than pre-commit's is how a
        # guard script quietly rots — its own lint errors are then never seen. Keep
        # this command and the pre-commit `files:` patterns in agreement.
        #
        # `--exclude docs` covers the formatter only: doc snippets are deliberately
        # laid out for reading, and `ruff check` still reads them (see ruff.toml).
        run: |
          ruff check .
          ruff format --check --exclude docs .

      - name: Type check (mypy) — AI core [strict]
        working-directory: packages/ai
        run: mypy careerforge_ai

      - name: Type check (mypy) — API
        working-directory: apps/api
        run: mypy src

      - name: Tests — AI core
        run: pytest packages/ai/tests -q

      - name: Tests — API
        working-directory: apps/api
        run: pytest -q

      - name: Tests — evaluation metrics
        # The metric implementations have their own tests: a confusion matrix that counts every pair
        # once per declared label produces a plausible, wrong number, and PHASE 12 is where that
        # happened. Metrics are code.
        run: pytest evals/tests -q

      - name: Datasets are in sync with the generator
        run: python evals/generate_datasets.py --check

      - name: Evaluation suites
        # Exits 2 when a *gate* threshold is missed; `report`-severity misses are printed and do not
        # fail the build. No API key is needed: the suite runs the zero-key provider chain.
        run: python evals/run.py

      - name: Core-domain coverage gate
        # 75% of the modules whose behaviour the product is (scope declared in the script), not 75%
        # of the repository — the difference is the difference between a target and a vanity metric.
        run: python scripts/coverage_report.py --min-core 75

      - name: Upload quality artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            reports/eval-report.json
            reports/eval-report.md
            reports/confidence-calibration.json
            reports/confidence-calibration.md
            reports/coverage-summary.md
            reports/coverage.xml
          if-no-files-found: warn

      - name: Migrations apply cleanly on SQLite
        working-directory: apps/api
        run: alembic upgrade head

      - name: Server boots and honours the response contract
        working-directory: apps/api
        run: |
          uvicorn careerforge_api.main:app --port 8123 --log-level warning &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/api/v1/system/health >/dev/null && break
            sleep 1
          done
          echo "--- health ---"
          curl -s http://127.0.0.1:8123/api/v1/system/health | tee /tmp/health.json
          python -c "import json,sys; d=json.load(open('/tmp/health.json')); assert d['success'] is True; assert d['requestId']; print('envelope ok')"
          echo "--- demo login ---"
          curl -s -X POST http://127.0.0.1:8123/api/v1/auth/demo > /tmp/demo.json
          python -c "import json; d=json.load(open('/tmp/demo.json')); assert d['data']['accessToken']; assert d['data']['user']['isDemo'] is True; print('demo login ok')"
          echo "--- unknown route must still be enveloped ---"
          STATUS=$(curl -s -o /tmp/404.json -w '%{http_code}' http://127.0.0.1:8123/api/v1/definitely-not-a-route)
          test "$STATUS" = "404"
          python -c "import json; d=json.load(open('/tmp/404.json')); assert d['success'] is False; assert d['error']['code']=='NOT_FOUND'; assert d['requestId']; print('404 envelope ok')"
          kill $SERVER_PID

  # ───────────────────────────────────────────────────────────────────────────
  # The production path. Same suite, different storage and queue backends, so a
  # dialect drift between SQLite and PostgreSQL fails the build instead of
  # surprising someone in production (ADR-004).
  # ───────────────────────────────────────────────────────────────────────────
  api-postgres:
    name: API · PostgreSQL + pgvector
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "false"
      DATABASE_URL: postgresql+asyncpg://careerforge:careerforge@localhost:5432/careerforge
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0000
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careerforge
          POSTGRES_PASSWORD: careerforge
          POSTGRES_DB: careerforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careerforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/ai[dev]"
          pip install -e "apps/api[dev]"

      - name: Enable pgvector
        run: |
          PGPASSWORD=careerforge psql -h localhost -U careerforge -d careerforge \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Migrations apply cleanly on PostgreSQL
        working-directory: apps/api
        run: alembic upgrade head

      - name: Tests against PostgreSQL
        working-directory: apps/api
        run: pytest -q

  # ───────────────────────────────────────────────────────────────────────────
  web:
    name: Web · typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

      - name: Tests — components and runtime guards
        run: pnpm --filter @careerforge/web test

  # ───────────────────────────────────────────────────────────────────────────
  # The browser. Everything below the end-to-end layer has a blind spot that looks
  # like coverage: jsdom has no layout engine, and Node's fetch does not enforce
  # CORS. PHASE 12 shipped three defects that 1,000 passing tests could not see —
  # a 375px table that hid its own cost column, a browser origin the API refused,
  # and a mobile drawer rendered underneath its own overlay. This job is those
  # three, permanently.
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E · Playwright · real Chrome
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "true"
      SQLITE_PATH: data/ci-e2e.db
      ENVIRONMENT: development
      LLM_PROVIDER: heuristic
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0000
      CORS_ORIGINS: http://127.0.0.1:3318,http://localhost:3318
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8318/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_BASE_URL: http://127.0.0.1:3318
      # The budgets this stack runs with, and why they are not the shipped ones.
      #
      # The suite is one user driving ~45 flows in about ninety seconds. That is not a load a human
      # produces, and the shipped AI budget is 20 requests per minute per user: measured in PHASE 14,
      # the last sixty seconds of a full run contained 33 requests to AI-marked paths against a
      # bucket of 20, and the bucket ran dry — the last specs failed with a 429 that renders in the
      # app as "Rate limit exceeded for ai requests" on a failed job analysis. A red build that reads
      # like a product bug is worse than no build.
      #
      # Correcting the classification (GET /jobs/{id}/match and GET /ai/interview/{id} are reads, not
      # model spend) removed ten of those thirty-three; the remaining 23 spending calls per minute are
      # still above 20, so the stack declares its own budget.
      #
      # `apps/api/tests/conftest.py` declares the same kind of budget for the unit suite
      # (rate_limit_ai_per_min = 10_000) for the same reason. The shipped defaults are untouched and
      # are asserted in `apps/api/tests/test_rate_limit.py`; `docs/API.md` §1.7 documents them, and
      # `apps/web/e2e/README.md` explains this stack.
      RATE_LIMIT_AI_PER_MIN: "600"
      RATE_LIMIT_READ_PER_MIN: "10000"
      RATE_LIMIT_WRITE_PER_MIN: "10000"
      # 20 uploads per hour is the product's limit and this suite needs about two per run — but a
      # developer re-running the suite against a database they keep would otherwise spend the hourly
      # budget in a few runs and then debug a 429 that is not a regression.
      RATE_LIMIT_UPLOAD_PER_HOUR: "500"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/ai[dev]"
          pip install -e "apps/api[dev]"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the API
        working-directory: apps/api
        run: |
          nohup uvicorn careerforge_api.main:app --host 127.0.0.1 --port 8318 --log-level warning &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8318/api/v1/system/health >/dev/null && break
            sleep 1
          done

      - name: Build and start the web app
        run: |
          pnpm --filter @careerforge/web build
          nohup pnpm --filter @careerforge/web start --port 3318 > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3318/login >/dev/null && break
            sleep 1
          done

      - name: End-to-end flows
        # `channel: chrome` uses the runner's preinstalled Chrome — no browser download, which is
        # also why the config never calls `playwright install`.
        run: pnpm --filter @careerforge/web test:e2e

      - name: Accessibility gate (axe) — 0 critical, 0 serious
        # A named step of its own because this is a gate, not a report. The failures it catches are
        # not cosmetic and cannot be "kept an eye on": a 10px label at 3.99:1 is unreadable for a
        # low-vision user, and a scrollable panel with no tab stop is unreachable by keyboard. Both
        # are invisible in a screenshot, in a code review, and in the 301 component tests (jsdom
        # computes no colour and lays nothing out) — which is exactly why the check has to be
        # mechanical and has to fail the build. PHASE 13 shipped these ten pages with 0 critical and
        # 10 serious violations; a report nobody is required to read is how that happened.
        #
        # The spec itself decides what blocks: `critical` and `serious` fail, `moderate` and `minor`
        # are printed and attached as test annotations. That split is deliberate and load-bearing —
        # a gate that also fires on a heading-order nit gets disabled, and then it guards nothing.
        # `e2e/helpers/axe.ts` holds the assertion; `apps/web/e2e/a11y.spec.ts` holds the pages.
        #
        # `e2e/a11y.spec.ts` re-runs the ten a11y tests that the step above already covered (five
        # pages × two viewports). That duplicates a little wall-clock time on purpose: it makes
        # "accessibility failed" a distinct, green-or-red line in the job, and it can be re-run on
        # its own while debugging. The upload step below keeps the failure artefacts.
        #
        # The path argument goes straight after the script name with NO `--`. pnpm forwards a
        # literal `--` into the command line, playwright then ignores the positional argument and
        # the step silently re-runs the *entire* suite — measured, not assumed: `pnpm … test:e2e --
        # e2e/a11y.spec.ts --list` printed "Running 50 tests" while `pnpm … test:e2e
        # e2e/a11y.spec.ts --list` printed only the ten a11y tests.
        run: pnpm --filter @careerforge/web test:e2e e2e/a11y.spec.ts

      - name: Upload the failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
