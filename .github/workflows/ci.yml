name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Node 22, not 20, and the reason is a hard requirement rather than a preference: pnpm 11.7.0 (the
  # version this repository pins in `package.json` → `packageManager`) imports `node:sqlite`, which
  # does not exist before Node 22.5. On Node 20 pnpm itself fails with
  # `ERR_UNKNOWN_BUILTIN_MODULE: No such built-in module: node:sqlite` — which is what the first two CI
  # runs reported, from `actions/setup-node` (whose pnpm cache step shells out to pnpm) and from
  # `infra/docker/Dockerfile.web` (whose base image was `node:20-alpine`).
  NODE_VERSION: "22"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The zero-dependency path. This is the job that proves the product works with
  # no PostgreSQL, no Redis and no API key — the configuration most reviewers
  # will actually run (ADR-004, ADR-009).
  # ───────────────────────────────────────────────────────────────────────────
  api-sqlite:
    name: API · SQLite · no external services
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "true"
      ENVIRONMENT: test
      LLM_PROVIDER: heuristic
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages
        # Order matters, and it is not alphabetical: `apps/api`'s build hook declares its sibling core
        # as an absolute `file://` URL, so installing the API also installs `careerforge-ai` as a
        # *regular* package into site-packages. The editable core afterwards replaces that copy, which
        # keeps `careerforge_ai.__file__` inside the checkout — where `--source=careerforge_ai` can
        # measure it and `_repo_root()` resolves the repository rather than the Python installation.
        # Measured: with the core first, this job's coverage gate read 37.6% instead of 92.5%, because
        # the measured files were the site-packages copies.
        run: |
          python -m pip install --upgrade pip
          # The API first, the core second — see the note above for why the order is load-bearing.
          pip install -e "apps/api[dev]"
          pip install -e "packages/ai[dev,parsing]"

      - name: Lint (ruff)
        # The whole repository, not just the two packages: `scripts/` and `evals/`
        # are guarded by pre-commit, and a scope narrower than pre-commit's is how a
        # guard script quietly rots — its own lint errors are then never seen. Keep
        # this command and the pre-commit `files:` patterns in agreement.
        #
        # `--exclude docs` covers the formatter only: doc snippets are deliberately
        # laid out for reading, and `ruff check` still reads them (see ruff.toml).
        run: |
          ruff check .
          ruff format --check --exclude docs .

      - name: Type check (mypy) — AI core [strict]
        working-directory: packages/ai
        run: mypy careerforge_ai

      - name: Type check (mypy) — API
        working-directory: apps/api
        run: mypy src

      - name: Tests — AI core
        run: pytest packages/ai/tests -q

      - name: Tests — API
        working-directory: apps/api
        run: pytest -q

      - name: Tests — evaluation metrics
        # The metric implementations have their own tests: a confusion matrix that counts every pair
        # once per declared label produces a plausible, wrong number, and PHASE 12 is where that
        # happened. Metrics are code.
        run: pytest evals/tests -q

      - name: Datasets are in sync with the generator
        run: python evals/generate_datasets.py --check

      - name: Evaluation suites
        # Exits 2 when a *gate* threshold is missed; `report`-severity misses are printed and do not
        # fail the build. No API key is needed: the suite runs the zero-key provider chain.
        run: python evals/run.py

      - name: Core-domain coverage gate
        # 75% of the modules whose behaviour the product is (scope declared in the script), not 75%
        # of the repository — the difference is the difference between a target and a vanity metric.
        run: python scripts/coverage_report.py --min-core 75

      - name: Upload quality artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            reports/eval-report.json
            reports/eval-report.md
            reports/confidence-calibration.json
            reports/confidence-calibration.md
            reports/coverage-summary.md
            reports/coverage.xml
          if-no-files-found: warn

      - name: Migrations apply cleanly on SQLite
        working-directory: apps/api
        run: alembic upgrade head

      - name: Server boots and honours the response contract
        working-directory: apps/api
        run: |
          uvicorn careerforge_api.main:app --port 8123 --log-level warning &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/api/v1/system/health >/dev/null && break
            sleep 1
          done
          echo "--- health ---"
          curl -s http://127.0.0.1:8123/api/v1/system/health | tee /tmp/health.json
          python -c "import json,sys; d=json.load(open('/tmp/health.json')); assert d['success'] is True; assert d['requestId']; print('envelope ok')"
          echo "--- demo login ---"
          curl -s -X POST http://127.0.0.1:8123/api/v1/auth/demo > /tmp/demo.json
          python -c "import json; d=json.load(open('/tmp/demo.json')); assert d['data']['accessToken']; assert d['data']['user']['isDemo'] is True; print('demo login ok')"
          echo "--- unknown route must still be enveloped ---"
          STATUS=$(curl -s -o /tmp/404.json -w '%{http_code}' http://127.0.0.1:8123/api/v1/definitely-not-a-route)
          test "$STATUS" = "404"
          python -c "import json; d=json.load(open('/tmp/404.json')); assert d['success'] is False; assert d['error']['code']=='NOT_FOUND'; assert d['requestId']; print('404 envelope ok')"
          kill $SERVER_PID

  # ───────────────────────────────────────────────────────────────────────────
  # The production path. Same suite, different storage and queue backends, so a
  # dialect drift between SQLite and PostgreSQL fails the build instead of
  # surprising someone in production (ADR-004).
  # ───────────────────────────────────────────────────────────────────────────
  api-postgres:
    name: API · PostgreSQL + pgvector
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "false"
      DATABASE_URL: postgresql+asyncpg://careerforge:careerforge@localhost:5432/careerforge
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0000
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careerforge
          POSTGRES_PASSWORD: careerforge
          POSTGRES_DB: careerforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careerforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages
        # Order matters, and it is not alphabetical: `apps/api`'s build hook declares its sibling core
        # as an absolute `file://` URL, so installing the API also installs `careerforge-ai` as a
        # *regular* package into site-packages. The editable core afterwards replaces that copy, which
        # keeps `careerforge_ai.__file__` inside the checkout — where `--source=careerforge_ai` can
        # measure it and `_repo_root()` resolves the repository rather than the Python installation.
        # Measured: with the core first, this job's coverage gate read 37.6% instead of 92.5%, because
        # the measured files were the site-packages copies.
        run: |
          python -m pip install --upgrade pip
          # The API first, the core second — see the note above for why the order is load-bearing.
          pip install -e "apps/api[dev]"
          pip install -e "packages/ai[dev,parsing]"

      - name: Enable pgvector
        run: |
          PGPASSWORD=careerforge psql -h localhost -U careerforge -d careerforge \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Migrations apply cleanly on PostgreSQL
        working-directory: apps/api
        run: alembic upgrade head

      - name: Tests against PostgreSQL
        working-directory: apps/api
        run: pytest -q

  # ───────────────────────────────────────────────────────────────────────────
  web:
    name: Web · typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `with: version` — the package manager version lives in `package.json` under
      # `packageManager`, and declaring it in both places is an error, not a redundancy:
      # `pnpm/action-setup` refuses to run with "Multiple versions of pnpm specified" when the
      # workflow and the manifest disagree. Measured on this workflow's first run (2026-09-26).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

      - name: Tests — components and runtime guards
        run: pnpm --filter @careerforge/web test

  # ───────────────────────────────────────────────────────────────────────────
  # The browser. Everything below the end-to-end layer has a blind spot that looks
  # like coverage: jsdom has no layout engine, and Node's fetch does not enforce
  # CORS. PHASE 12 shipped three defects that 1,000 passing tests could not see —
  # a 375px table that hid its own cost column, a browser origin the API refused,
  # and a mobile drawer rendered underneath its own overlay. This job is those
  # three, permanently.
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E · Playwright · real Chrome
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "true"
      SQLITE_PATH: data/ci-e2e.db
      ENVIRONMENT: development
      LLM_PROVIDER: heuristic
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0000
      CORS_ORIGINS: http://127.0.0.1:3318,http://localhost:3318
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8318/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_BASE_URL: http://127.0.0.1:3318
      # The budgets this stack runs with, and why they are not the shipped ones.
      #
      # The suite is one user driving ~45 flows in about ninety seconds. That is not a load a human
      # produces, and the shipped AI budget is 20 requests per minute per user: measured in PHASE 14,
      # the last sixty seconds of a full run contained 33 requests to AI-marked paths against a
      # bucket of 20, and the bucket ran dry — the last specs failed with a 429 that renders in the
      # app as "Rate limit exceeded for ai requests" on a failed job analysis. A red build that reads
      # like a product bug is worse than no build.
      #
      # Correcting the classification (GET /jobs/{id}/match and GET /ai/interview/{id} are reads, not
      # model spend) removed ten of those thirty-three; the remaining 23 spending calls per minute are
      # still above 20, so the stack declares its own budget.
      #
      # `apps/api/tests/conftest.py` declares the same kind of budget for the unit suite
      # (rate_limit_ai_per_min = 10_000) for the same reason. The shipped defaults are untouched and
      # are asserted in `apps/api/tests/test_rate_limit.py`; `docs/API.md` §1.7 documents them, and
      # `apps/web/e2e/README.md` explains this stack.
      RATE_LIMIT_AI_PER_MIN: "600"
      RATE_LIMIT_READ_PER_MIN: "10000"
      RATE_LIMIT_WRITE_PER_MIN: "10000"
      # 20 uploads per hour is the product's limit and this suite needs about two per run — but a
      # developer re-running the suite against a database they keep would otherwise spend the hourly
      # budget in a few runs and then debug a 429 that is not a regression.
      RATE_LIMIT_UPLOAD_PER_HOUR: "500"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          # The API first, the core second — see the note above for why the order is load-bearing.
          pip install -e "apps/api[dev]"
          pip install -e "packages/ai[dev,parsing]"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the API
        working-directory: apps/api
        run: |
          nohup uvicorn careerforge_api.main:app --host 127.0.0.1 --port 8318 --log-level warning &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8318/api/v1/system/health >/dev/null && break
            sleep 1
          done

      - name: Build and start the web app
        run: |
          pnpm --filter @careerforge/web build
          nohup pnpm --filter @careerforge/web start --port 3318 > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3318/login >/dev/null && break
            sleep 1
          done

      - name: End-to-end flows
        # `channel: chrome` uses the runner's preinstalled Chrome — no browser download, which is
        # also why the config never calls `playwright install`.
        run: pnpm --filter @careerforge/web test:e2e

      - name: Accessibility gate (axe) — 0 critical, 0 serious
        # A named step of its own because this is a gate, not a report. The failures it catches are
        # not cosmetic and cannot be "kept an eye on": a 10px label at 3.99:1 is unreadable for a
        # low-vision user, and a scrollable panel with no tab stop is unreachable by keyboard. Both
        # are invisible in a screenshot, in a code review, and in the 301 component tests (jsdom
        # computes no colour and lays nothing out) — which is exactly why the check has to be
        # mechanical and has to fail the build. PHASE 13 shipped these ten pages with 0 critical and
        # 10 serious violations; a report nobody is required to read is how that happened.
        #
        # The spec itself decides what blocks: `critical` and `serious` fail, `moderate` and `minor`
        # are printed and attached as test annotations. That split is deliberate and load-bearing —
        # a gate that also fires on a heading-order nit gets disabled, and then it guards nothing.
        # `e2e/helpers/axe.ts` holds the assertion; `apps/web/e2e/a11y.spec.ts` holds the pages.
        #
        # `e2e/a11y.spec.ts` re-runs the ten a11y tests that the step above already covered (five
        # pages × two viewports). That duplicates a little wall-clock time on purpose: it makes
        # "accessibility failed" a distinct, green-or-red line in the job, and it can be re-run on
        # its own while debugging. The upload step below keeps the failure artefacts.
        #
        # The path argument goes straight after the script name with NO `--`. pnpm forwards a
        # literal `--` into the command line, playwright then ignores the positional argument and
        # the step silently re-runs the *entire* suite — measured, not assumed: `pnpm … test:e2e --
        # e2e/a11y.spec.ts --list` printed "Running 50 tests" while `pnpm … test:e2e
        # e2e/a11y.spec.ts --list` printed only the ten a11y tests.
        run: pnpm --filter @careerforge/web test:e2e e2e/a11y.spec.ts

      - name: Upload the failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # The container path. PHASE 15's first task, and the reason it exists: every
  # Dockerfile and compose file in this repository was written on a machine with
  # no container runtime, so until this job runs for the first time the image
  # path is *unwitnessed*. `reports/release-proof.md` says exactly that in its
  # NOT RUN table, and this job is what converts it into evidence.
  #
  # It builds and inspects; it does not push and it does not deploy. Pushing needs
  # registry credentials this project does not hold, and a release should not
  # depend on a secret a reviewer cannot see.
  # ───────────────────────────────────────────────────────────────────────────
  images:
    name: Images · docker build (api + web) and compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compose file is valid and resolves
        # `config -q` parses the file, resolves every `env_file`/variable and fails on a
        # malformed service, so a broken compose file is caught in seconds rather than at
        # deploy time. No daemon is needed for this step.
        #
        # The throwaway secret is required, and that is the compose file working as intended:
        # `JWT_SECRET` is declared `${JWT_SECRET:?...}` there, because a container that boots with a
        # documented default secret is how a "temporary" deployment becomes a permanent one. The step
        # validates the file, not a secret, so a value that is obviously not one is the right input.
        env:
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-0000
        run: docker compose config -q

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          load: true
          tags: careerforge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          load: true
          tags: careerforge-web:ci
          # The web bundle inlines this at build time; `next build` fails loudly if it is
          # absent, which is the behaviour we want rather than a bundle pointing at localhost.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The API image boots and answers its own health check
        # Building an image proves it has layers; it does not prove the process starts. The
        # container runs the zero-key provider and an ephemeral SQLite database, so this needs
        # no services and no secrets.
        run: |
          docker run -d --name cf-api -p 8000:8000 \
            -e USE_SQLITE=true \
            -e ENVIRONMENT=development \
            -e JWT_SECRET=ci-only-secret-not-used-anywhere-else-0000 \
            -e LLM_PROVIDER=heuristic \
            careerforge-api:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/system/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/system/health | head -c 400
          echo
          curl -sf http://127.0.0.1:8000/api/v1/system/ready | head -c 400
          echo
          docker logs cf-api --tail 20
          docker rm -f cf-api

  # ───────────────────────────────────────────────────────────────────────────
  # The containerized stack, actually started.
  #
  # Two jobs above touch the container path: `images` builds the images, and
  # `api-postgres` runs the suite against a pgvector service container. Neither
  # brings the *topology* up: the one-shot migration service, the API, the worker,
  # Redis and the built frontend, wired the way `docker-compose.yml` wires them.
  # Until this job existed, `docker compose up` had never been executed anywhere —
  # the release proof says so in its NOT RUN table, and the honest consequence was
  # that `v1.0.0` could not be tagged.
  #
  # This is the deployment proof this repository can produce without a cloud
  # account: a real PostgreSQL 16 + pgvector, a real Redis, migrations from an
  # empty database, the demo seed applied twice, the published health/readiness/
  # version contract, and the full browser suite — desktop and mobile, accessibility
  # gate included — against the *containerized* URLs rather than against processes
  # started on the runner.
  #
  # What it still is not: a public URL. No hosting account or credential is
  # available to this project, so the demo link an interviewer would open does not
  # exist yet. That remains the one claim nothing here makes.
  # ───────────────────────────────────────────────────────────────────────────
  compose-stack:
    name: Containers · full stack · migrations · browser E2E
    runs-on: ubuntu-latest
    env:
      # The compose file requires this rather than defaulting it (see `x-api-env`), and a CI value is
      # the right kind of secret here: obvious, disposable, never used outside this job.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0000
      POSTGRES_PASSWORD: careerforge
      ENVIRONMENT: development
      # The build identity the images bake in, so `/system/version` can name the commit under test.
      # Without these the API answers `"commit": null` and the version-proof step below has nothing to
      # check — which is what happened on this job's first successful start.
      GIT_SHA: ${{ github.sha }}
      BUILD_TIME: ${{ github.event.repository.updated_at }}
      # The browser talks to `localhost:3000`, so that is the origin the API must allow. Getting this
      # wrong is the failure mode `e2e/cors.spec.ts` exists to catch, and it shows up in the browser only.
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      # The suite is one user driving 45 flows in ~90 seconds; apps/web/e2e/README.md explains why the
      # browser stack declares its own budgets instead of running on the shipped defaults.
      RATE_LIMIT_AI_PER_MIN: "600"
      RATE_LIMIT_READ_PER_MIN: "10000"
      RATE_LIMIT_WRITE_PER_MIN: "10000"
      RATE_LIMIT_UPLOAD_PER_HOUR: "500"
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install the Python packages (for the seed script)
        # `scripts/seed.py` runs from the runner against the *published* PostgreSQL port, because the API
        # image deliberately does not ship `scripts/` — it is the deployment image, not the repository.
        run: |
          python -m pip install --upgrade pip
          # The API first, the core second — see the note above for why the order is load-bearing.
          pip install -e "apps/api[dev]"
          pip install -e "packages/ai[dev,parsing]"

      - name: Install Node dependencies (for the browser suite)
        run: pnpm install --frozen-lockfile

      - name: Build the images
        run: docker compose build

      - name: Bring the stack up
        run: docker compose up -d

      - name: The migration service must have succeeded
        # `api` waits on `migrate` with `service_completed_successfully`, so a healthy API is already
        # evidence — but "it worked" is not the same as "it exited 0", and a failed one-shot container
        # would otherwise leave the reason inside its own logs.
        run: |
          for _ in $(seq 1 60); do
            cid=$(docker compose ps -aq migrate)
            if [ -n "$cid" ] && [ "$(docker inspect -f '{{.State.Running}}' "$cid")" = "false" ]; then break; fi
            sleep 2
          done
          cid=$(docker compose ps -aq migrate)
          code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
          echo "migrate exited with $code"
          docker compose logs --no-log-prefix migrate
          test "$code" = "0"

      - name: The API and the frontend must answer
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/system/health >/dev/null && break
            sleep 2
          done
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000/login >/dev/null && break
            sleep 2
          done
          echo "--- containers ---"
          docker compose ps
          echo "--- web routes (the built image, not next dev) ---"
          for path in / /login /system; do
            printf '%s ' "$path"
            curl -s -o /dev/null -w '%{http_code}\n' "http://localhost:3000$path"
          done

      - name: pgvector is real, and the schema came from the migrations
        # The point of the containerized path is the *other* backend: if this were SQLite in disguise,
        # `VECTOR_BACKEND=pgvector` would be a comment rather than a fact.
        run: |
          docker compose exec -T postgres psql -U careerforge -d careerforge -tAc \
            "SELECT extname FROM pg_extension ORDER BY extname" | tee /tmp/extensions.txt
          grep -qx vector /tmp/extensions.txt
          tables=$(docker compose exec -T postgres psql -U careerforge -d careerforge -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "tables in the migrated schema: $tables"
          test "$tables" -ge 28

      - name: The published contract answers, including the version proof
        # `/system/version` is the deployment's identity. If it does not name the commit that was
        # pushed then whatever is answering is not this release, and every other claim in this job
        # would be about a different build. PHASE 15 requires exactly this check before `v1.0.0`.
        run: |
          curl -s http://localhost:8000/api/v1/system/health > /tmp/health.json
          curl -s http://localhost:8000/api/v1/system/ready > /tmp/ready.json
          curl -s http://localhost:8000/api/v1/system/version > /tmp/version.json
          python - <<'PY'
          import json, os

          health = json.load(open("/tmp/health.json"))
          ready = json.load(open("/tmp/ready.json"))
          version = json.load(open("/tmp/version.json"))

          print("health :", json.dumps(health.get("data", {}).get("checks", {}), ensure_ascii=False))
          print("ready  :", json.dumps({k: ready.get("data", {}).get(k) for k in ("ready", "gate", "degraded")}, ensure_ascii=False))
          print("version:", json.dumps(version.get("data", {}), ensure_ascii=False))

          assert health["success"] is True, health
          assert health["data"]["checks"]["database"]["status"] == "ok", health
          assert ready["data"]["ready"] is True, ready

          head = os.environ["GITHUB_SHA"]
          raw = json.dumps(version.get("data", {}))
          assert head[:7] in raw or head in raw, (
              f"/system/version does not name this commit ({head[:7]}): {raw}"
          )
          print("version proof ok: the running build names this commit")
          PY

      - name: The demo seed is idempotent, twice, against the real database
        env:
          USE_SQLITE: "false"
          DATABASE_URL: postgresql+asyncpg://careerforge:careerforge@localhost:5432/careerforge
          QUEUE_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: |
          python scripts/seed.py | tail -5
          python scripts/seed.py | tail -5

      - name: The browser suite against the containerized stack
        # Desktop and mobile, accessibility gate included, real Chrome. The same suite the `e2e` job runs
        # against processes; running it here is what turns "the images build" into "the stack works".
        run: pnpm --filter @careerforge/web test:e2e

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-log-prefix --tail 200
