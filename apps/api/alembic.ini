# Alembic configuration for the CareerForge AI API.
#
#   cd apps/api
#   $env:USE_SQLITE="true"; alembic upgrade head
#
# NOTE: this file is ASCII-only on purpose. Alembic reads alembic.ini with the
# *locale* encoding (see alembic.util.compat.read_config_parser), so a non-ASCII
# character in a comment is a UnicodeDecodeError on a Windows box with a non-UTF-8
# code page -- a config file must not be able to break the migration command.
#
# `script_location` and `prepend_sys_path` use %(here)s so the commands work from any
# working directory; the Docker `migrate` service and CI both rely on that.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
# The URL is resolved from careerforge_ai.config.Settings (see alembic/env.py):
# leaving it empty here keeps configuration in one place. `-x db_url=...` overrides.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
