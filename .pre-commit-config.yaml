# Pre-commit hooks. Install once with:  pre-commit install
#
# The goal is that a reviewer never sees a commit that would fail CI. Hooks are
# deliberately fast: lint and format only. Type checking, tests and builds stay
# in CI where they belong.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
        exclude: ^(apps/web/tsconfig\.json|\.vscode/)
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]
        # Committing straight to main is fine while the project is being built;
        # remove this entry once the repo is public and PRs are the norm.
        stages: [manual]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix", "--config", "ruff.toml"]
        files: ^(packages/ai|apps/api|tests|scripts|evals)/.*\.py$
      - id: ruff-format
        args: ["--config", "ruff.toml"]
        files: ^(packages/ai|apps/api|tests|scripts|evals)/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(ts|tsx|js|jsx|json|css|md|ya?ml)$
        exclude: ^(pnpm-lock\.yaml|docs/assets/)

  - repo: local
    hooks:
      # Guards the two architectural rules that are easiest to violate by accident.
      - id: no-framework-imports-in-ai-core
        name: packages/ai must not import a web framework or ORM
        entry: python scripts/check_layering.py
        language: system
        pass_filenames: false
        files: ^packages/ai/.*\.py$

      - id: no-hardcoded-colours
        name: components must use design tokens, not raw colours
        entry: python scripts/check_design_tokens.py
        language: system
        pass_filenames: false
        files: ^(apps/web|packages/ui)/.*\.(tsx|ts|css)$

      - id: max-file-length
        name: no file over 500 lines
        entry: python scripts/check_file_length.py
        language: system
        pass_filenames: false
        files: \.(py|ts|tsx)$
