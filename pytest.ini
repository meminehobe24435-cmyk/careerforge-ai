[pytest]
# Root-directory declaration for the suites that have no configuration file of their own.
#
# `evals/tests` is one: with nothing to anchor it, pytest chose `evals/tests` itself as the rootdir on
# a clean CI runner and inserted *that* directory into `sys.path`, so modules that import their own
# package (`from evals.metrics import expected_calibration_error`) raised
# `ModuleNotFoundError: No module named 'evals'`. The same command passed on the development machine,
# because what pytest inserts also depends on the invocation, on leftovers like `__pycache__`, and on
# which directories editable installs have already contributed.
#
# A test suite whose imports depend on how it was invoked fails for whoever runs it differently.
# Declaring the path here makes `pytest evals/tests`, `pytest evals` and `pytest` from the repository
# root all behave the same. Suites that carry their own `pyproject.toml` (`packages/ai`, `apps/api`)
# keep their own rootdir and their own settings; this file is not consulted for them.
pythonpath = .
