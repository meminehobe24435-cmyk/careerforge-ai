packages:
  - "apps/web"
  - "packages/shared"
  - "packages/ui"
  - "packages/config"

# pnpm 11 refuses to run dependency build scripts it has not been told about, and
# treats an unapproved one as a fatal install error (`ERR_PNPM_IGNORED_BUILDS`).
# That turned a fresh clone's very first `pnpm install` into a failure, so the two
# dependencies that legitimately need to compile are approved explicitly here.
#
# `unrs-resolver` ships a native binary and arrives transitively via
# `eslint-config-next`; `esbuild` arrives via vite/vitest and needs its platform binary
# before any test can run. Everything else stays unapproved by default — naming the
# exceptions is safer than disabling the protection wholesale.
#
# Note for whoever reads this next: `esbuild` previously carried the literal value
# `set this to true or false`, copied from pnpm's own error message. The install then
# failed with the same error it was meant to silence, which is what a placeholder does.
allowBuilds:
  esbuild: true
  unrs-resolver: true
